 <!DOCTYPE html>
<html>
<head>
    <title>Upload Image - SkinSense</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        #preview {
            width: 300px;
            height: auto;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Upload Skin Image</h2>
        <form enctype="multipart/form-data">
            <input type="file" class="form-control mb-3" accept="image/*" onchange="loadFile(event)"><br>
            <img id="preview" alt="Skin-Preview"/><br>
            
            <label>Select Symptoms:</label><br>
            <input type="checkbox" value="itchy"> Itchy
            <input type="checkbox" value="painful"> Painful
            <input type="checkbox" value="red"> Red <br><br>
            
            <button class="btn btn-warning">Submit</button>
        </form>
    </div>
    <script>
        function loadFile(event) {
            var input=event.target;
            var image=document.getElementById('preview');
            if(input.files && input.files[0]) {
                var reader=new FileReader();
                reader.onload=function(e) {
                    image.src=e.target.result;
                } 
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
